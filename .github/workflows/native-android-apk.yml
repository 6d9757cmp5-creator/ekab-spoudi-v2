name: V2 Native Android APK (original Compose code)
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    name: Build the original Android UI
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout V2 repository
        uses: actions/checkout@v4
      - name: Extract original Kotlin Android project
        run: |
          mkdir native-app
          unzip -q native-android/EKAB-Spoudi-V2-Exact-Android-Source.zip -d native-app
          test -f native-app/app/src/main/java/com/example/ui/screens/HomeScreen.kt
          test -f native-app/app/src/main/java/com/example/mentor/screens/MentorHubScreen.kt
      - name: Set independent app identity only for compiled debug APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native-app/app/build.gradle.kts')
          s=p.read_text()
          assert 'applicationId = "com.aistudio.ekabspoudi.hqmtvy"' in s
          s=s.replace('applicationId = "com.aistudio.ekabspoudi.hqmtvy"', 'applicationId = "com.ekabspoudi.v2"')
          s=s.replace('signingConfig = signingConfigs.getByName("debugConfig")', '// use default local debug signing key')
          p.write_text(s)
          p=Path('native-app/app/src/main/res/values/strings.xml')
          p.write_text(p.read_text().replace('ΕΚΑΒ Σπουδή</string>', 'ΕΚΑΒ Σπουδή V2</string>'))
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install API 36.1 SDK
        run: sdkmanager --install 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Assemble standalone test APK
        working-directory: native-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish test APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ekab-spoudi-v2-original-ui-debug-apk
          path: native-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
