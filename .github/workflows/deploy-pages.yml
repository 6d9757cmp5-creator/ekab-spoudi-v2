name: Deploy EKAB Spoudi V2 Web
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *' # refresh independent V2 public educational snapshot daily
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Read public EKAB 1 content into a temporary checkout
        shell: bash
        run: git clone --quiet --depth 1 --branch main https://github.com/6d9757cmp5-creator/ekab-spoudi.git "$RUNNER_TEMP/ekab-v1-public"
      - name: Prepare isolated Safari website
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html main.js mentor-adaptive.js data.js extra-data.js sw.js manifest.webmanifest _site/
          node --check _site/data.js
          node --check _site/extra-data.js
          node --check _site/mentor-adaptive.js
          node --check _site/main.js
          node scripts/test-mentor-adaptive.cjs
          cp assets/* _site/assets/
          python3 scripts/import-v1-data.py "$RUNNER_TEMP/ekab-v1-public" _site
          node --check _site/v1-content/v1-bridge.js
          node scripts/smoke-v2-web.cjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
