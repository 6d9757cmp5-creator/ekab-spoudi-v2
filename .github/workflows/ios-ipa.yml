name: Build EKAB Spoudi V2 iOS IPA (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ekab-v2-ipa-latest
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Bundle complete V2 website and V1 read-only library for offline fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/WebAssets/assets ios/Assets.xcassets/AppIcon.appiconset
          cp index.html main.js data.js extra-data.js mentor-adaptive.js v1-study-library.js auto-update.js manifest.webmanifest sw.js ios/WebAssets/
          cp -R assets/. ios/WebAssets/assets/
          git clone --quiet --depth 1 --branch main https://github.com/6d9757cmp5-creator/ekab-spoudi.git "$RUNNER_TEMP/ekab-v1-public"
          python3 scripts/import-v1-data.py "$RUNNER_TEMP/ekab-v1-public" ios/WebAssets
          node --check ios/WebAssets/main.js
          node --check ios/WebAssets/mentor-adaptive.js
          node --check ios/WebAssets/auto-update.js
          node --check ios/WebAssets/v1-content/v1-bridge.js
          node scripts/test-mentor-adaptive.cjs
          node scripts/smoke-v2-web.cjs ios/WebAssets
          node scripts/test-ipa-layout.cjs
          sips -z 1024 1024 assets/icon-512.png --out ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png >/dev/null
          cat > ios/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          test -s ios/WebAssets/index.html
          test -s ios/WebAssets/v1-content/v1-bridge.js
      - name: Generate standalone iOS project
        run: xcodegen generate --spec project.yml
      - name: Compile iPhone application without Apple signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project EKABSpoudiV2.xcodeproj \
            -scheme EKABSpoudiV2 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ekab-v2-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package actual .app into unsigned .ipa
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ekab-v2-build/Build/Products/Release-iphoneos/EKABSpoudiV2.app"
          test -d "$APP" && test -f "$APP/EKABSpoudiV2" || (echo 'Compiled iPhone .app missing' && exit 1)
          test -f "$APP/WebAssets/index.html" || (echo 'Bundled Safari HTML missing' && exit 1)
          mkdir -p out/Payload
          ditto "$APP" out/Payload/EKABSpoudiV2.app
          (cd out && /usr/bin/zip -qry ../EKAB-Spoudi-V2-unsigned.ipa Payload)
          unzip -t EKAB-Spoudi-V2-unsigned.ipa | tail -1
          ls -lh EKAB-Spoudi-V2-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: EKAB-Spoudi-V2-unsigned-IPA
          path: EKAB-Spoudi-V2-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable IPA on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.2-ios-unsigned"
          asset="EKAB-Spoudi-V2-1.0.2-unsigned.ipa"
          cp EKAB-Spoudi-V2-unsigned.ipa "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" "$asset" \
              --target "${GITHUB_SHA}" \
              --title "ΕΚΑΒ Σπουδή V2 iOS 1.0.2 (unsigned)" \
              --notes "Unsigned iOS build for the independent EKAB Spoudi V2 web container. Download for manual signing using an appropriate iOS signing tool. Not installable directly on iPhone; not a native Kotlin port."
          fi
