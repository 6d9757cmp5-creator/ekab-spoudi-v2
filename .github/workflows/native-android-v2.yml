name: Native Android V2 — original Compose app
on:
  push:
    branches: [restore-original-android-compose]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Extract original Android V2 source
        run: |
          mkdir -p native-android/source
          unzip -q native-android/EKAB-Spoudi-V2-Android-Source.zip -d native-android/source
          test -f native-android/source/app/src/main/java/com/example/ui/screens/HomeScreen.kt
          test -f native-android/source/app/src/main/java/com/example/mentor/screens/MentorHubScreen.kt
      - name: Build original native Android app
        working-directory: native-android/source
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ekab-spoudi-v2-native-compose-debug-apk
          path: native-android/source/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
