name: Preserve native Android source
on:
  push:
    branches: [main]
    paths:
      - 'native-android/EKAB-Spoudi-V2-Exact-Android-Source.zip'
      - '.github/workflows/source-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-source-sync
  cancel-in-progress: false
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract original source snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, json, shutil
          archive=Path('native-android/EKAB-Spoudi-V2-Exact-Android-Source.zip')
          target=Path('native-android/source')
          assert archive.exists(), "Source archive missing"
          with zipfile.ZipFile(archive) as z:
              bad=z.testzip()
              assert bad is None, f"Corrupt archive member: {bad}"
              data=json.loads(z.read('SOURCE_SHA256.json'))
              assert 'app/google-services.json' in data['excluded']
              assert 'app/src/main/res/values/firebase_applet_config.xml' in data['excluded']
              for name,digest in data['kept_files'].items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest, f"Source mismatch: {name}"
              if target.exists(): shutil.rmtree(target)
              target.mkdir(parents=True)
              for info in z.infolist():
                  if info.is_dir(): continue
                  name=Path(info.filename)
                  assert not name.is_absolute() and '..' not in name.parts
                  path=target/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(z.read(info.filename))
          print('Verified and unpacked original native source')
          PY
      - name: Commit isolated source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-android/source
          if git diff --cached --quiet; then
            echo "Source unchanged"
          else
            git commit -m "chore(android): expand verified original Kotlin source"
            git push origin HEAD:main
          fi
